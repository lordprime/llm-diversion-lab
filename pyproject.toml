[project]
name = "llm-diversion-lab"
version = "0.0.0"
description = "LLM Diversion Lab: harness for a security-research study"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "python-ulid",
    "dnslib",
    "structlog",
    "pyyaml",
    "psycopg[binary]>=3",
    "prometheus-client>=0.26.0",
]

[project.scripts]
# The lab CLI (control/cli). `uv sync` installs it into the project venv; the
# control-plane image runs it as `python -m control.cli`.
labctl = "control.cli.main:main"

[project.optional-dependencies]
# In-cell components (LLM tap, surface injector). The control plane never imports these.
cell = [
    "mitmproxy==12.3.1",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "types-pyyaml",
    "docker>=7.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["control", "cell", "agents"]

[tool.uv]
# Built and installed (editable) so the [project.scripts] entry `labctl` exists.
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["forks", "targets", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
