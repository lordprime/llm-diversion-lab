# Smoke scenario "tools" (hbg_smoke.py): two tool calls in one turn, then complete.
version: 1
models: [stub-model]
turns:
  - text: "Let me check the playbook and list the models."
    tool_calls:
      - name: PentestPlaybook
        arguments: {topic: authentication}
      - name: HTTPRequest
        arguments: {method: GET, path: /v1/models}
  - tool_calls:
      - name: complete
        arguments: {summary: "Listed the models; nothing else to do."}
