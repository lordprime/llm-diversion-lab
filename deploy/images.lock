# Logical image name -> pinned digest. Cells pull `image@digest`, never a tag.
#
# Entries change only in reviewed commits. The build-images workflow
# (.github/workflows/build-images.yml; runs on a `lab-v*` tag or by hand, with an
# optional version tag) builds goat-<name> for every targets/<name>/Dockerfile,
# lab-cell and control, and pushes ghcr.io/lordprime/<name>. Pinning a
# CI-built digest (docs/DEPLOYMENT.md §0.5):
#   1. take the entry from the run's job summary or its `<name>-digest` artifact
#      (images.lock.entry.yml): name, image, digest, expect_tools and role;
#   2. paste it under `images:` (replace the old entry of that name; never use a
#      tag), keeping its role: goat-dvga -> target, lab-cell -> infra,
#      control -> control;
#   3. commit it for review; release.sh pulls exactly these image@digest refs.
# After a package's first build, make it public on GHCR (no secrets are in the
# images; the host pulls anonymously and never logs in), then check an anonymous
# `docker pull <image>@<digest>` works (docs/DEPLOYMENT.md §0.5).
#
# expect_tools: commands a smoke check expects on PATH inside the image.
# role: agent | target | infra | control. cell-guard lets an agent start only
#   `agent` images (never a target, the harness's lab-cell or a control-plane image).
images:
  # The pinned base of the GOAT images (multi-arch index digest,
  # python 3.10.22-bookworm). Seeded by hand.
  - name: python-3.10-bookworm
    image: docker.io/library/python
    digest: sha256:f72a86806f92fe13a49f49aeca1db0b19ea5cf4a0470b842a01b0e14314945b8
    expect_tools: [curl, bash]
    role: infra

  # The control-plane database (deploy/compose/control-plane.yml, service `db`):
  # official postgres 17.11-bookworm, multi-arch index digest, resolved 7 Nov 2026.
  # PostgreSQL >= 13 is required (release.sh's rollback uses DROP DATABASE ... WITH
  # (FORCE)). The compose file pins this same image@digest (a test checks that they
  # agree). The digest must be refreshed only by a reviewed commit that changes
  # both files; never replace it with a tag.
  - name: postgres-17-bookworm
    image: docker.io/library/postgres
    digest: sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    expect_tools: [pg_dump, pg_restore, psql, pg_isready]
    role: control

  # The DVGA GOAT target, built by build-images.yml at 72c2758
  # (tag sha-72c27588f130; dvga fork c587128, CVE-Bench fork 9304c0e).
  - name: goat-dvga
    image: ghcr.io/lordprime/goat-dvga
    digest: sha256:577635ad415a37129117364af928ab9dc9cb507eb00daab474eb1eafe2439125
    expect_tools: [curl, bash]
    role: target

  # The harness's cell image (injector, tap, catcher, stub LLM, probe, cell-guard),
  # built by build-images.yml at 72c2758 (tag sha-72c27588f130).
  - name: lab-cell
    image: ghcr.io/lordprime/lab-cell
    digest: sha256:2194b498513dee24e2dcfd124a7fff76c41b856064d8694a33b4332373c85c97
    expect_tools: [python, mitmdump, uvicorn]
    role: infra
