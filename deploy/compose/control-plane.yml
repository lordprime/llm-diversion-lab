# LLM Diversion Lab control plane: Postgres, the one-shot migration, the Collector API.
#
# Used ONLY as (deploy/remote/release.sh, deploy/remote/status.sh):
#   docker compose --project-name lab --env-file /srv/lab/secrets/lab.env \
#     -f /srv/lab/current/deploy/compose/control-plane.yml ...
#
# Contract (tests/deploy/test_control_plane_compose.py):
# * `db` is the official postgres image pinned by the digest in deploy/images.lock
#   (PostgreSQL >= 13). POSTGRES_DB and POSTGRES_USER are set explicitly: release.sh
#   runs pg_dump / pg_restore inside this container with them. The password is
#   LAB_DB_PASSWORD from lab.env, generated once on the host by bootstrap.sh (base
#   role) and carried over by secrets.sh; the stack refuses to start without it.
#   Postgres reads it only when the data directory is first initialised.
# * `migrate` is a one-shot `alembic upgrade head` (python -m control.cli.migrate,
#   which configures the redacted JSON logging first). release.sh runs it with
#   `run --rm --no-deps migrate` after a pg_dump; `up` runs it again before the
#   Collector starts, where it is a no-op at head.
# * `collector` is the Collector API (python -m control.api: configure_logging, then
#   uvicorn with log_config=None). Its /metrics derive from the runs table and the
#   self-test status file (/srv/lab/state, read-only), so they survive restarts.
# * Every published port binds 127.0.0.1 only: Postgres on 5432 (labctl on the host),
#   the Collector on 8100 (the runner, labctl doctor, Prometheus). 8000 stays free
#   for the Control/Results API that Caddy fronts; the Collector is never behind Caddy.
# * The one network has an explicit subnet outside the run-cell range 10.231.0.0/16,
#   Docker's default address pools (172.20.0.0/14), the home LAN (192.168.0.0/16)
#   and Twingate/CGNAT (100.64.0.0/10).
# * Images: `db` is pulled by digest. `migrate` and `collector` are built from this
#   release tree (deploy/compose/control.Dockerfile, base images pinned by digest),
#   which needs `release.sh --allow-build` until CI publishes a pinned
#   control-plane image; without it release.sh refuses the unpinned local tag.
#   The built image is tagged per release, lab/control:$LAB_RELEASE_TAG, which
#   deploy/remote/release.sh sets on every compose call to the tag of the tree it
#   runs (status.sh and secrets.sh do the same for `current`). A rollback therefore
#   starts the previous release's own image: never the failed release's migrate on
#   the restored database. Compose refuses to run without it.
# * Postgres data: /srv/lab/db/pgdata is mounted AS the data directory (the image's
#   default PGDATA). /srv/lab/db is lab:lab 0700 (base role); the entrypoint chowns
#   the mount point itself to postgres (uid 999), so initdb never has to enter the
#   0700 parent. release.sh creates pgdata (0700) if it is missing and never touches
#   it again; Ansible does not manage it.
# * `gateway` is the model gateway (python -m control.gateway), the only way from a
#   run cell to a model. It runs only with the `models` profile (the GPU host) and
#   publishes no port. Two listeners, each on one address: the cell-facing proxy on
#   its fixed address on the `cells` network (host.env's LAB_LLM_GATEWAY, the one
#   destination the host firewall lets a cell bridge reach) and the admin API on its
#   fixed address on `control`, where the runner registers each run's key. It reaches
#   Ollama over the internal `models` network. LAB_GATEWAY_ADMIN_SECRET comes from
#   lab.env; without it the gateway refuses to start (no other service needs it).

name: lab

x-control-image: &control-image
  image: lab/control:${LAB_RELEASE_TAG:?LAB_RELEASE_TAG is not set (release.sh sets it)}
  build:
    context: ../..
    dockerfile: deploy/compose/control.Dockerfile

x-control-env: &control-env
  # No password in the URL: libpq reads PGPASSWORD.
  DATABASE_URL: postgresql+psycopg://lab@db:5432/lab
  PGPASSWORD: ${LAB_DB_PASSWORD:?LAB_DB_PASSWORD is not set}
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

services:
  db:
    image: docker.io/library/postgres@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?LAB_DB_PASSWORD is not set (deploy/bootstrap.sh generates it)}
      # The image's default auth: scram-sha-256 over TCP (the app services, labctl);
      # trust only on the container's own Unix socket (release.sh's pg_dump/psql).
    volumes:
      - /srv/lab/db/pgdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    networks: [control]
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    <<: *control-image
    restart: "no"
    command: ["python", "-m", "control.cli.migrate"]
    environment:
      <<: *control-env
    depends_on:
      db:
        condition: service_healthy
    networks: [control]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  collector:
    <<: *control-image
    restart: unless-stopped
    command: ["python", "-m", "control.api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *control-env
      LAB_SELFTEST_STATUS_FILE: /srv/lab/state/selftest.json
    volumes:
      - /srv/lab/state:/srv/lab/state:ro
    ports:
      - 127.0.0.1:8100:8000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  gateway:
    <<: *control-image
    profiles: [models]
    restart: unless-stopped
    command: ["python", "-m", "control.gateway"]
    environment:
      <<: *control-env
      LAB_OLLAMA_URL: http://ollama:11434
      LAB_GATEWAY_LISTEN: 172.31.232.10:4000
      LAB_GATEWAY_ADMIN_LISTEN: 172.31.231.20:4001
      LAB_GATEWAY_ADMIN_SECRET: ${LAB_GATEWAY_ADMIN_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      control:
        ipv4_address: 172.31.231.20
      cells:
        ipv4_address: 172.31.232.10
      models: {}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Measured, not guessed (tests.gateway.serve_gateway on a Ryzen 7 5800H, CPython
    # 3.12; probes in the M2 Task 1 report, fix round 3): idle 82 MiB RSS. Under 40 s
    # of 4 runs posting 16 MiB bodies two at a time (the caps then hold 4 large
    # bodies; measured with 2 parse threads, the gateway now runs 1) the peak was
    # 373 MiB for bodies with one character outside the BMP (their decoded text takes
    # 4 bytes a character), 238-259 MiB for the costliest body the caps allow, and
    # 173-209 MiB for bodies refused as too complex. One parse takes at most 40 MiB,
    # or 80 MiB with such a character (tracemalloc). 768 MiB is twice the worst peak.
    mem_limit: 768m
    # one process; the event loop, one parse thread, the DB threadpool and libpq
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://172.31.231.20:4001/healthz', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  control:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.231.0/24
  # the gateway's cell-facing network: run cells reach 172.31.232.10:4000 here
  cells:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.232.0/24
  # the gateway and Ollama only; no route out
  models:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.233.0/24
