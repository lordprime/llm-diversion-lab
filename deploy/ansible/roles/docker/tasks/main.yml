---
- name: Check Docker's address pools stay clear of the cell networks
  ansible.builtin.command:
    argv:
      - python3
      - -I
      - -c
      - |
        import ipaddress, json, sys
        pools = [ipaddress.ip_network(p) for p in json.loads(sys.argv[1])]
        cells = [ipaddress.ip_network(c) for c in json.loads(sys.argv[2])]
        clash = [f"{p} overlaps {c}" for p in pools for c in cells if p.overlaps(c)]
        sys.exit("; ".join(clash) or None)
      - "{{ docker_default_address_pools | map(attribute='base') | list | to_json }}"
      - "{{ lab_cell_networks | to_json }}"
  changed_when: false
  check_mode: false

# Cell containers resolve through Docker's embedded DNS, which forwards to these
# upstreams. With an explicit non-loopback upstream the forwarded query leaves from
# the container's network namespace, so it crosses the forward chain and a cell's
# query is dropped there. With a loopback resolver (systemd-resolved's 127.0.0.53)
# dockerd would forward from the host's namespace instead, around the firewall.
- name: Check the upstream DNS for containers is explicit and not loopback
  ansible.builtin.assert:
    that:
      - lab_upstream_dns | length > 0
      - lab_upstream_dns | select('match', '^[0-9]{1,3}([.][0-9]{1,3}){3}$') | list | length == lab_upstream_dns | length
      - lab_upstream_dns | select('match', '^(127|0)[.]') | list | length == 0
    fail_msg: >-
      Set lab_upstream_dns (this host's `vars:` in hosts.yml) to one or more IPv4
      resolvers that are not loopback (127.0.0.0/8), e.g. the LXC's gateway. A
      loopback resolver makes dockerd forward cell DNS from the host's namespace,
      around the cell firewall (DEPLOYMENT §0.2).
    quiet: true

- name: Install the apt repository prerequisites
  ansible.builtin.apt:
    lock_timeout: "{{ lab_apt_lock_timeout }}"
    name: [ca-certificates, curl, gnupg]
    state: present

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# The key is downloaded to a candidate file and checked there; the trusted keyring
# is only written after the check passes, so a bad download never replaces it.
- name: Download Docker's apt signing key (candidate)
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_key_candidate }}"
    force: true
    owner: root
    group: root
    mode: "0600"

- name: Read the candidate key's fingerprints
  ansible.builtin.command:
    argv: [gpg, --show-keys, --with-colons, "{{ docker_apt_key_candidate }}"]
  changed_when: false
  check_mode: false
  register: docker_key_info
  when: not ansible_check_mode

# Exactly one primary key, and it is Docker's: an extra key appended to the file
# (which apt would also trust) fails the check. gpg prints each primary key as a
# `pub` record followed by its `fpr` record.
- name: Check the keyring holds exactly Docker's release key
  vars:
    docker_key_records: "{{ docker_key_info.stdout_lines }}"
  ansible.builtin.assert:
    that:
      - docker_key_records | select('match', '^pub:') | list | length == 1
      - (docker_key_records | select('match', '^fpr:') | first).split(':')[9] == docker_apt_key_fingerprint
    fail_msg: >-
      The key from {{ docker_apt_key_url }} is not exactly Docker's signing key
      {{ docker_apt_key_fingerprint }}; refusing to trust it (the keyring is unchanged).
    quiet: true
  when: not ansible_check_mode

- name: Install the checked key as the trusted keyring
  ansible.builtin.copy:
    src: "{{ docker_apt_key_candidate }}"
    dest: /etc/apt/keyrings/docker.asc
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Add Docker's apt repository
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"

- name: Refresh the apt cache
  ansible.builtin.apt:
    lock_timeout: "{{ lab_apt_lock_timeout }}"
    update_cache: true
  changed_when: false

- name: Read the installed docker-ce version
  ansible.builtin.command:
    argv: [dpkg-query, --show, "--showformat=${Version}", docker-ce]
  changed_when: false
  failed_when: false
  check_mode: false
  register: docker_installed

- name: List the docker-ce versions in the repository
  ansible.builtin.command:
    argv: [apt-cache, madison, docker-ce]
  changed_when: false
  check_mode: false
  register: docker_madison

- name: Choose the docker-ce version
  vars:
    docker_minor_re: "^5:{{ docker_ce_minor | regex_escape }}\\.[0-9]+-"
    docker_forbidden_re: "^5:({{ docker_ce_forbidden_versions | map('regex_escape') | join('|') }})-"
    docker_candidates: >-
      {{ docker_madison.stdout_lines
         | map('regex_replace', '^\s*docker-ce\s*[|]\s*(\S+)\s*[|].*$', '\1')
         | select('match', docker_minor_re)
         | reject('match', docker_forbidden_re)
         | list }}
  ansible.builtin.set_fact:
    # Keep an installed version of the pinned minor (no surprise upgrades on re-run);
    # otherwise take the newest allowed patch.
    docker_ce_version: >-
      {{ docker_installed.stdout
         if (docker_installed.rc == 0
             and docker_installed.stdout is match(docker_minor_re)
             and docker_installed.stdout is not match(docker_forbidden_re))
         else (docker_candidates | first | default('')) }}

- name: Check a usable docker-ce version exists
  ansible.builtin.assert:
    that:
      - docker_ce_version | length > 0
    fail_msg: >-
      No docker-ce {{ docker_ce_minor }}.x other than
      {{ docker_ce_forbidden_versions | join(', ') }} in Docker's repository. Pick another
      29.x minor with `docker_ce_minor` under this host's `vars:` in hosts.yml.
    quiet: true
  when: not ansible_check_mode

- name: Install Docker CE and the compose plugin, version {{ docker_ce_version }}
  ansible.builtin.apt:
    lock_timeout: "{{ lab_apt_lock_timeout }}"
    name:
      - "docker-ce={{ docker_ce_version }}"
      - "docker-ce-cli={{ docker_ce_version }}"
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    # No Recommends: docker-ce-rootless-extras would come in unpinned and unheld.
    install_recommends: false
    allow_change_held_packages: true
  when: docker_ce_version | length > 0

- name: Hold the Docker packages (upgraded only in a maintenance window)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  register: docker_hold
  # dpkg --set-selections fails at once while the dpkg lock is held.
  until: docker_hold is succeeded
  retries: "{{ (lab_apt_lock_timeout | int) // 10 }}"
  delay: 10
  loop: "{{ docker_held_packages }}"
  when: not ansible_check_mode

- name: Write /etc/docker/daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file %s
  notify: Restart Docker

- name: Start Docker at boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Apply a changed daemon.json now
  ansible.builtin.meta: flush_handlers

- name: Let the lab user run the control plane
  ansible.builtin.user:
    name: "{{ lab_user }}"
    groups: docker
    append: true
  when: not ansible_check_mode

- name: Verify the Docker installation
  ansible.builtin.import_tasks: verify.yml
  when: not ansible_check_mode

- name: Check containers can start (CVE-2025-52881 Docker-in-LXC breakage)
  ansible.builtin.import_tasks: cve_2025_52881.yml
  when: not ansible_check_mode
