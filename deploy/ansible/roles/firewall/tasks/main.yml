---
# nftables inside the LXC (DEPLOYMENT §0.2). Runs BEFORE the docker role, and fails
# closed: Docker is installed with a drop-in that Requires= lab-firewall.service,
# so Docker never starts (not even its first start from the apt postinst) without
# the host firewall. Two layers stop run-cell egress:
# 1. table inet lab_host (lab-firewall.service): input drop for cells and a forward
#    chain that drops cell traffic leaving the cell networks, and forwarded IPv6;
# 2. Docker's DOCKER-USER chain (lab-cell-egress.service), written with iptables-nft
#    in the syntax Docker itself uses there, re-applied whenever Docker starts.
# The Proxmox firewall on the container (internet only, never the LAN) is the manual
# step in §0.1, verified by `labctl doctor`.
- name: Check the LLM gateway exception is well formed
  ansible.builtin.assert:
    that:
      - lab_llm_gateway_address == '' or lab_llm_gateway_address is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
      - lab_llm_gateway_port | int >= 1
      - lab_llm_gateway_port | int <= 65535
    fail_msg: lab_llm_gateway_address must be empty or an IPv4 address, with a valid port.
    quiet: true

- name: Install nftables and iptables
  ansible.builtin.apt:
    name: [nftables, iptables]
    state: present

- name: Read the iptables backend
  ansible.builtin.command:
    argv: [iptables, --version]
  changed_when: false
  check_mode: false
  register: firewall_iptables_version

- name: Check iptables writes nftables rules
  ansible.builtin.assert:
    that:
      - "'nf_tables' in firewall_iptables_version.stdout"
    fail_msg: >-
      iptables is '{{ firewall_iptables_version.stdout }}', not the nf_tables backend;
      Docker's rules and the lab's would live in two different firewalls.
      Run: update-alternatives --set iptables /usr/sbin/iptables-nft
    quiet: true

- name: Create /etc/lab
  ansible.builtin.file:
    path: /etc/lab
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the host firewall (input and forward)
  ansible.builtin.template:
    src: host.nft.j2
    dest: /etc/lab/host.nft
    owner: root
    group: root
    mode: "0644"
    validate: nft --check --file %s
  notify: Reload the host firewall

- name: Write the cell egress script
  ansible.builtin.template:
    src: lab-cell-egress.sh.j2
    dest: /usr/local/sbin/lab-cell-egress
    owner: root
    group: root
    mode: "0755"
  notify: Re-apply the cell egress rules

- name: Install the firewall units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - lab-firewall.service
    - lab-cell-egress.service
  notify:
    - Reload the host firewall
    - Re-apply the cell egress rules

- name: Create the docker.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d/
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Make Docker require the host firewall
  ansible.builtin.template:
    src: docker-requires-lab-firewall.conf.j2
    dest: /etc/systemd/system/docker.service.d/10-lab-firewall.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# Its start runs /etc/nftables.conf (`flush ruleset`) and its stop flushes too,
# either of which would wipe Docker's rules and the lab's. Masked, so nothing can
# start or restart it; a running instance is not stopped (that would flush).
- name: Mask the distribution's nftables.service
  ansible.builtin.systemd_service:
    name: nftables
    masked: true

# A failing nft load fails this task, and the play stops before Docker exists.
- name: Enable and start the lab firewall units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - lab-firewall.service
    - lab-cell-egress.service
  when: not ansible_check_mode

- name: Apply changed rules now
  ansible.builtin.meta: flush_handlers

- name: Verify both firewall layers are loaded
  ansible.builtin.command:
    argv: [/usr/local/sbin/lab-cell-egress, check]
  changed_when: false
  when: not ansible_check_mode
