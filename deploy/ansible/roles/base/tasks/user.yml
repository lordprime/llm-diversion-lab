---
- name: Create the lab group
  ansible.builtin.group:
    name: "{{ lab_user }}"
    system: true

- name: Create the lab user (runs the control plane; no password, no SSH key)
  ansible.builtin.user:
    name: "{{ lab_user }}"
    group: "{{ lab_user }}"
    system: true
    shell: /bin/bash
    home: "/home/{{ lab_user }}"
    create_home: true
    password: "!"
    update_password: on_create
