---
# Password login is turned off only after a key-only login from this workstation
# has been proven, so a missing key cannot lock the operator out.
- name: Prove key-only SSH login works from this workstation
  ansible.builtin.command:
    argv:
      - ssh
      - -o
      - BatchMode=yes
      - -o
      - PasswordAuthentication=no
      - -o
      - KbdInteractiveAuthentication=no
      - -o
      - PreferredAuthentications=publickey
      - -o
      - ConnectTimeout=15
      - -p
      - "{{ ansible_port | default(22) }}"
      - "{{ ansible_user }}@{{ ansible_host }}"
      - "true"
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  check_mode: false
  register: base_ssh_key_probe

- name: Stop unless key-only login is proven
  ansible.builtin.assert:
    that:
      - base_ssh_key_probe.rc == 0
    fail_msg: >-
      Key-only SSH login to {{ ansible_user }}@{{ ansible_host }} failed
      ({{ base_ssh_key_probe.stderr | default('') | trim }}). Password login stays on
      until a key works: add this workstation's public key to
      ~{{ ansible_user }}/.ssh/authorized_keys on the host (DEPLOYMENT §0.1), then re-run.
    quiet: true

- name: Allow only key logins (root by key only, when root provisions)
  ansible.builtin.template:
    src: sshd-lab.conf.j2
    dest: /etc/ssh/sshd_config.d/10-lab.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
