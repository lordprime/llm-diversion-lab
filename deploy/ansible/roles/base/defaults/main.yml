---
base_packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - iptables
  - jq
  - nftables
  - openssh-server
  - openssl
  - python3
  - restic
  - rsync
  - tcpdump
  - unattended-upgrades

# Only C and C.UTF-8 exist in the CT 111 template (§0.5).
base_locale: C.UTF-8

# Per profile. The LXC profile keeps root login by key only: CT 111 was set up with
# root-over-Twingate SSH, a documented exception (DEPLOYMENT §0.1,
# ENGINEERING_STANDARDS §7). A VM (sysbox profile) provisions as a sudo user and
# turns root login off entirely.
base_ssh_permit_root_login: "{{ 'prohibit-password' if isolation == 'lxc' else 'no' }}"

# Packages that only change in a maintenance window (DEPLOYMENT §2 row 6).
base_unattended_blocklist:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - sysbox-ce
  - linux-image-

base_lab_dirs:
  - { path: "", mode: "0755" }
  - { path: releases, mode: "0755" }
  - { path: secrets, mode: "0700" }
  - { path: artifacts, mode: "0750" }
  - { path: cells, mode: "0750" }
  - { path: db, mode: "0700" }
  - { path: ops, mode: "0750" }
  - { path: backups, mode: "0700" }
  # The self-test status (control/core/selftest_status.py): written by labctl as
  # root, read through a read-only mount by the Collector (uid 10001).
  - { path: state, mode: "0755" }

# A pinned uv on the host: release.sh installs labctl per release with it, from the
# release's uv.lock, into releases/<tag>/.venv (DEPLOYMENT §4.2). The tarball is
# checked against its published SHA-256 before it is unpacked; change all three
# together in a reviewed commit.
base_uv_version: "0.11.21"
base_uv_sha256:
  x86_64: 8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050
  aarch64: 88e800834007cc5efd4675f166eb2a51e7e3ad19876d85fa8805a6fb5c922397
base_uv_arch: "{{ ansible_facts['architecture'] }}"
# labctl's interpreter, installed by uv: the control-plane image's Python minor (3.12),
# at the newest patch release the pinned uv can install (uv 0.11.21 knows up to
# 3.12.13; the image is 3.12.16). Raise it together with base_uv_version.
base_uv_python: "3.12.13"
base_uv_python_dir: /opt/lab/python
