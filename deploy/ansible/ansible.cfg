# Used by deploy/bootstrap.sh through ANSIBLE_CONFIG (an explicit path, so Ansible
# does not skip it when the checkout lives on a world-writable mount).
[defaults]
interpreter_python = /usr/bin/python3
host_key_checking = True
retry_files_enabled = False
callback_result_format = yaml
nocows = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
