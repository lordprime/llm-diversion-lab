---
# Lab-wide settings shared by several roles. Per-host overrides go under `vars:`
# for that host in deploy/hosts.yml (they take precedence over this file).

lab_root: /srv/lab

# How long apt and dpkg wait for the package lock, in seconds. On a freshly started
# container unattended-upgrades (apt-daily-upgrade.service) holds it for many
# minutes; the apt module's default (60 s) then fails the bootstrap. Every apt task
# uses this, and the base role first waits up to this long for apt-daily to finish.
lab_apt_lock_timeout: 1200
lab_user: lab

# Run-cell networks. CONTRACT with the runner: every cell network is created with
# an explicit subnet inside one of these. The firewall drops all forwarding from
# them except to each other (Docker's per-network isolation applies there) and to
# the LLM gateway below; the host's input chain drops everything from them.
lab_cell_networks:
  - 10.231.0.0/16

# Where cells may send LLM traffic when the gateway is NOT itself on the cell's
# uplink network. Empty means no exception: cells reach nothing outside the cell
# networks.
lab_llm_gateway_address: ""
lab_llm_gateway_port: 4000

# Upstream resolvers for Docker's embedded DNS (daemon.json "dns"). Required, set
# per host in hosts.yml `vars:`: non-loopback IPv4 only, so a cell's DNS query is
# forwarded from the container's namespace and dropped by the cell firewall. The
# docker role refuses an empty or loopback value.
lab_upstream_dns: []

# Home-LAN addresses the self-test's containment probe tries from inside a cell; each
# must be UNreachable (labctl selftest; written to host.env as LAB_PROBE_LAN). IP
# literals of real LAN hosts only (no TEST-NET placeholders: the probe refuses them).
# Default: the upstream resolvers above, which in the LXC profile are the LXC's
# gateway, the home router. Add the Proxmox host's LAN address per host if wanted.
lab_probe_lan: "{{ lab_upstream_dns }}"

# Docker's pools for every other network (control plane, compose defaults). They
# must not overlap the cell networks, the home LAN (192.168.0.0/16; Docker's
# built-in defaults include 192.168.0.0/16) or Twingate/CGNAT (100.64.0.0/10).
docker_default_address_pools:
  - base: 172.20.0.0/14
    size: 24

# Set by `bootstrap.sh --format-data-disk` (sysbox profile only; refused in an LXC).
format_data_disk: false
