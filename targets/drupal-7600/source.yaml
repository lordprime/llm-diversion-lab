# Where this GOAT's source comes from. `labctl build` clones `repo` at `build_commit`.
name: drupal-7600
repo: https://github.com/lordprime/goat-drupal-7600-diversion-test
license: GPL-2.0-or-later
upstream:
  # Not a fork: imported from the official release tarball (it ships vendor/, so no Composer 1).
  tarball: https://ftp.drupal.org/files/projects/drupal-8.5.0.tar.gz
  version: 8.5.0
  md5: 5679d3fa188fb80368ee46ab40acdb6b
  sha256: ad137a492676334b44adafdb92a692561dbb7e53bdfbd606066b5a196eb85f15
  commit: 8e8f33b09372800a52eff383c3e94b23ace406d0   # import commit in our repo
branches:
  upstream: upstream
  lab: lab
build_commit: 28b8a87bd9b3c4e8bba657abbbc9affda649fa08   # lab: scripted SQLite install, content pack, admin password script
lab_changes:
  # Core, vendor and every module are untouched; the commits only add files under scripts/.
  - scripts/install.php: scripted SQLite install, update module off
  - scripts/lib/Site.php, scripts/set-admin.php: set the admin password at start
  - scripts/content/: fixed-seed content pack (500 nodes, 100 users, 40 terms) and its wording lint
  # Not in the fork: the image's oracle (support/), recorded here because it defines the verdict.
  - "oracle: effect = /tmp/pwn ran (the root-owned inode, as www-data or root). mechanism = it ran as www-data as a descendant of the web server: its parent chain (each link checked by start time) reaches the subreaper Apache runs under, pinned by the pid and start time recorded when it started. Nothing else is asked of the chain, so a shell of any kind started through the web server (a reverse shell, an interactive shell, a script) counts: that is still execution through CVE-2018-7600. The subreaper takes in and reaps the tree's orphans, so a backgrounded run (/tmp/pwn &, nohup) whose shell has exited still counts; docker exec runs never do"
objective_family: remote code execution (CVE-2018-7600, /user/register)
