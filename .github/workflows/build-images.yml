name: build-images

# Builds the lab's own images, checks each one and pushes it to GHCR:
#
# * goat-dvga  (role target)  targets/dvga/Dockerfile: the DVGA lab fork + CVE-Bench
#   evaluator, from the fork commits pinned in targets/dvga/source.yaml and
#   cell/oracle/source.yaml.
# * lab-cell   (role infra)   cell/Dockerfile, context the repository root (the root
#   .dockerignore allow-list): injector, tap, catcher, stub LLM, cell-guard, probe.
# * control    (role control) deploy/compose/control.Dockerfile, context the
#   repository root (its own control.Dockerfile.dockerignore): Collector + migrate.
#
# Each job publishes the digest it pushed in its job summary and a
# `<job>-digest` artifact holding a ready deploy/images.lock entry. Recording a
# digest in deploy/images.lock is a normal reviewed commit, never done here.
#
# Rules every job keeps (tests/deploy/test_build_images_workflow.py checks them):
# actions pinned by full commit SHA, checkout with persist-credentials: false,
# permissions granted per job (contents: read, packages: write) and none at the top.
on:
  push:
    tags:
      - "lab-v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goat-dvga:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/lordprime/goat-dvga
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read pinned fork commits
        id: pins
        run: |
          set -euo pipefail
          # top-level `key: value` of a source.yaml (indented upstream keys don't match)
          read_pin() { sed -n "s/^$2:[[:space:]]*\([^[:space:]#]*\).*/\1/p" "$1"; }
          dvga_repo=$(read_pin targets/dvga/source.yaml repo)
          dvga_commit=$(read_pin targets/dvga/source.yaml build_commit)
          eval_repo=$(read_pin cell/oracle/source.yaml repo)
          eval_commit=$(read_pin cell/oracle/source.yaml build_commit)
          [[ "$dvga_repo" == https://github.com/* && "$eval_repo" == https://github.com/* ]] \
            || { echo "unexpected fork repo URL" >&2; exit 1; }
          for c in "$dvga_commit" "$eval_commit"; do
            [[ "$c" =~ ^[0-9a-f]{40}$ ]] || { echo "not a full commit sha: $c" >&2; exit 1; }
          done
          {
            echo "dvga_repo=$dvga_repo"
            echo "dvga_commit=$dvga_commit"
            echo "eval_repo=$eval_repo"
            echo "eval_commit=$eval_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Clone forks at the pinned commits
        env:
          DVGA_REPO: ${{ steps.pins.outputs.dvga_repo }}
          DVGA_COMMIT: ${{ steps.pins.outputs.dvga_commit }}
          EVAL_REPO: ${{ steps.pins.outputs.eval_repo }}
          EVAL_COMMIT: ${{ steps.pins.outputs.eval_commit }}
        run: |
          set -euo pipefail
          fetch() {  # repo commit dir
            git init --quiet "$3"
            git -C "$3" fetch --quiet --depth 1 "$1" "$2"
            git -C "$3" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$3" rev-parse HEAD)" = "$2"
          }
          fetch "$DVGA_REPO" "$DVGA_COMMIT" "$RUNNER_TEMP/dvga"
          fetch "$EVAL_REPO" "$EVAL_COMMIT" "$RUNNER_TEMP/cvebench"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        env:
          DVGA_COMMIT: ${{ steps.pins.outputs.dvga_commit }}
          EVAL_COMMIT: ${{ steps.pins.outputs.eval_commit }}
        run: |
          set -euo pipefail
          docker buildx build --load \
            -f targets/dvga/Dockerfile \
            --build-context dvga="$RUNNER_TEMP/dvga" \
            --build-context cvebench="$RUNNER_TEMP/cvebench" \
            --build-arg DVGA_COMMIT="$DVGA_COMMIT" \
            --build-arg EVALUATOR_COMMIT="$EVAL_COMMIT" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t goat-dvga:ci \
            targets/dvga

      - name: Check tools and permissions inside the image
        run: |
          set -euo pipefail
          # tools the app and CVE-Bench's scripts need
          docker run --rm --entrypoint /bin/bash goat-dvga:ci -c 'command -v curl && command -v bash'
          # as the app user: nothing that decides the result is readable
          docker run --rm --user dvga --entrypoint /bin/bash goat-dvga:ci -c '
            set -u
            fail=0
            for p in /opt/support/grader.py /opt/support/launch.sh /cve_metadata.yml /entrypoint.sh; do
              if cat "$p" >/dev/null 2>&1; then echo "readable by dvga: $p"; fail=1; fi
            done
            for d in /opt/support /run/secrets; do
              if ls "$d" >/dev/null 2>&1; then echo "listable by dvga: $d"; fail=1; fi
            done
            for v in APPLICATION_NAME GRADER_OBJECTIVE; do
              if [ -n "${!v:-}" ]; then echo "image-wide env leaks $v"; fail=1; fi
            done
            exit $fail'
          # ownership and modes, as root
          docker run --rm --entrypoint /bin/bash goat-dvga:ci -c '
            set -eu
            test "$(stat -c %U:%G:%a /opt/support)" = root:root:700
            test "$(stat -c %U:%G:%a /run/secrets)" = root:root:700
            test "$(stat -c %U:%G:%a /cve_metadata.yml)" = root:root:400
            test "$(stat -c %U:%G:%a /opt/support/launch.sh)" = root:root:700
            test ! -e /opt/dvga/requirements.txt
            test ! -e /opt/dvga/README.md
            test ! -e /opt/dvga/tests
            # the base image ships one requirements.txt (mercurial help text); no other
            test -z "$(find / -xdev -name requirements.txt ! -path "/usr/lib/python3/dist-packages/mercurial/*" -print -quit)"
            ! grep -rli diversion /opt/dvga /opt/venv /opt/support /cve_metadata.yml /entrypoint.sh'

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Run the image's behaviour tests (health, done, permissions, objective, crash)
        env:
          GOAT_DVGA_IMAGE: goat-dvga:ci
          GOAT_DVGA_REQUIRE: "1"
        run: |
          uv sync --frozen
          uv run pytest -v tests/targets/test_dvga_image.py

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::12}"
          if [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          docker tag goat-dvga:ci "$IMAGE:$tag"
          docker push "$IMAGE:$tag" | tee push.log
          # the digest the registry reported for this push (the daemon's RepoDigests
          # can list the local build name first, so it is not used)
          digest=$(sed -n 's/^.*digest: \(sha256:[0-9a-f]*\) size: [0-9]*$/\1/p' push.log | tail -n1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: $digest" >&2; exit 1; }
          # and the registry must now serve exactly that digest at the tag
          served=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$served" == "$digest" ]] || { echo "registry serves $served at $IMAGE:$tag, push said $digest" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record the digest
        env:
          TAG: ${{ steps.push.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
          DVGA_COMMIT: ${{ steps.pins.outputs.dvga_commit }}
          EVAL_COMMIT: ${{ steps.pins.outputs.eval_commit }}
        run: |
          set -euo pipefail
          cat > images.lock.entry.yml <<EOF
          # Paste into deploy/images.lock in a reviewed commit.
            - name: goat-dvga
              image: ${IMAGE}
              digest: ${DIGEST}
              expect_tools: [curl, bash]
              role: target
              # tag ${TAG}; dvga ${DVGA_COMMIT}; evaluator ${EVAL_COMMIT}
          EOF
          {
            echo "## goat-dvga"
            echo
            echo "Pushed \`${IMAGE}:${TAG}\`"
            echo
            echo "**Digest:** \`${DIGEST}\`"
            echo
            echo "- DVGA fork commit: \`${DVGA_COMMIT}\`"
            echo "- CVE-Bench fork commit: \`${EVAL_COMMIT}\`"
            echo
            echo "deploy/images.lock entry (commit it by hand, after review):"
            echo
            echo '```yaml'
            cat images.lock.entry.yml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goat-dvga-digest
          path: images.lock.entry.yml

  lab-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/lordprime/lab-cell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require cell/Dockerfile and the root context allow-list
        run: |
          set -euo pipefail
          test -f cell/Dockerfile || { echo "::error::cell/Dockerfile is missing on ${GITHUB_REF}" >&2; exit 1; }
          # no cell/Dockerfile.dockerignore: the root .dockerignore allow-list is the context
          test ! -e cell/Dockerfile.dockerignore
          test -f .dockerignore

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        run: |
          set -euo pipefail
          docker buildx build --load \
            -f cell/Dockerfile \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t lab-cell:ci \
            .

      - name: Check the image (uid 10001, cell modules import, no control plane)
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' lab-cell:ci)" = 10001:10001
          run() { docker run --rm --network none lab-cell:ci "$@"; }
          test "$(run id -u):$(run id -g)" = 10001:10001
          # what the cell compose files run (and the images.lock expect_tools)
          run sh -c 'command -v python && command -v mitmdump && command -v uvicorn && command -v true'
          # every in-cell module imports as the unprivileged user
          run python -c "import cell.injector.placement, cell.injector.preflight, cell.tap.recorder, cell.catcher.http_app, cell.catcher.dns_server, cell.catcher.serve, cell.stub_llm.app, cell.cellguard.proxy, agents.scripted.agent"
          run mitmdump --version >/dev/null
          run sh -c '
            set -eu
            test "$(stat -c %u:%g:%a /evidence)" = 10001:10001:750
            test -f /opt/lab/cell/injector/addon.py
            test -f /opt/lab/cell/tap/addon.py
            # of the control plane only control/core; no build or repository leftovers
            for p in control/runner control/api control/db control/cli control/labeler \
                     cell/Dockerfile tests docs deploy .git .venv/bin/pytest; do
              if [ -e "/opt/lab/$p" ]; then echo "unexpected in the image: /opt/lab/$p"; exit 1; fi
            done'

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::12}"
          if [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          docker tag lab-cell:ci "$IMAGE:$tag"
          docker push "$IMAGE:$tag" | tee push.log
          # the digest the registry reported for this push (the daemon's RepoDigests
          # can list the local build name first, so it is not used)
          digest=$(sed -n 's/^.*digest: \(sha256:[0-9a-f]*\) size: [0-9]*$/\1/p' push.log | tail -n1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: $digest" >&2; exit 1; }
          # and the registry must now serve exactly that digest at the tag
          served=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$served" == "$digest" ]] || { echo "registry serves $served at $IMAGE:$tag, push said $digest" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record the digest
        env:
          TAG: ${{ steps.push.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cat > images.lock.entry.yml <<EOF
          # Paste into deploy/images.lock in a reviewed commit.
            - name: lab-cell
              image: ${IMAGE}
              digest: ${DIGEST}
              expect_tools: [python, mitmdump, uvicorn]
              role: infra
              # tag ${TAG}; repository commit ${GITHUB_SHA}
          EOF
          {
            echo "## lab-cell"
            echo
            echo "Pushed \`${IMAGE}:${TAG}\`"
            echo
            echo "**Digest:** \`${DIGEST}\`"
            echo
            echo "- Repository commit: \`${GITHUB_SHA}\`"
            echo
            echo "deploy/images.lock entry (commit it by hand, after review):"
            echo
            echo '```yaml'
            cat images.lock.entry.yml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab-cell-digest
          path: images.lock.entry.yml

  control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/lordprime/control
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        run: |
          set -euo pipefail
          # context: the repository root, as deploy/compose/control-plane.yml builds it;
          # BuildKit narrows it with deploy/compose/control.Dockerfile.dockerignore
          test -f deploy/compose/control.Dockerfile.dockerignore
          docker buildx build --load \
            -f deploy/compose/control.Dockerfile \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t control:ci \
            .

      - name: Check the image (uid 10001, entry points, migrations, no in-cell code)
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' control:ci)" = 10001:10001
          run() { docker run --rm --network none control:ci "$@"; }
          test "$(run id -u):$(run id -g)" = 10001:10001
          # both entry points of control-plane.yml import and parse arguments (no database)
          run python -m control.api --help >/dev/null
          run python -m control.cli.migrate --help >/dev/null
          # the Alembic scripts ship with the image and have a head
          run python -c "from control.cli.migrations import head_revisions; assert head_revisions()"
          run sh -c '
            set -eu
            # no in-cell code, no in-cell extras (mitmproxy), no dev group (pytest)
            for p in /app/cell /app/agents /app/tests /app/deploy /app/.git; do
              if [ -e "$p" ]; then echo "unexpected in the image: $p"; exit 1; fi
            done
            for m in mitmproxy pytest; do
              if python -c "import $m" 2>/dev/null; then echo "unexpected module: $m"; exit 1; fi
            done'

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::12}"
          if [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          docker tag control:ci "$IMAGE:$tag"
          docker push "$IMAGE:$tag" | tee push.log
          # the digest the registry reported for this push (the daemon's RepoDigests
          # can list the local build name first, so it is not used)
          digest=$(sed -n 's/^.*digest: \(sha256:[0-9a-f]*\) size: [0-9]*$/\1/p' push.log | tail -n1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: $digest" >&2; exit 1; }
          # and the registry must now serve exactly that digest at the tag
          served=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$served" == "$digest" ]] || { echo "registry serves $served at $IMAGE:$tag, push said $digest" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record the digest
        env:
          TAG: ${{ steps.push.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cat > images.lock.entry.yml <<EOF
          # Paste into deploy/images.lock in a reviewed commit.
            - name: control
              image: ${IMAGE}
              digest: ${DIGEST}
              expect_tools: [python]
              role: control
              # tag ${TAG}; repository commit ${GITHUB_SHA}
          EOF
          {
            echo "## control"
            echo
            echo "Pushed \`${IMAGE}:${TAG}\`"
            echo
            echo "**Digest:** \`${DIGEST}\`"
            echo
            echo "- Repository commit: \`${GITHUB_SHA}\`"
            echo
            echo "deploy/images.lock entry (commit it by hand, after review):"
            echo
            echo '```yaml'
            cat images.lock.entry.yml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-digest
          path: images.lock.entry.yml
