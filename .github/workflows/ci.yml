name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-extras
      # Pinned linters for tests/deploy; with LAB_REQUIRE_TOOLS=1 a missing tool fails
      # the suite instead of skipping. nft is needed for the firewall tests, which
      # run in a throwaway network namespace (sudo unshare -n on this runner).
      - name: Install the deploy linters (pinned)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nftables iptables
          uv tool install ansible-core==2.22.0
          uv tool install ansible-lint==26.11.0 --with ansible-core==2.22.0
          uv tool install shellcheck-py==0.11.0.1
          uv tool install shfmt-py==4.2.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy control cell agents
      - run: uv run pytest --cov=control --cov=cell --cov=agents --cov-report=term-missing
        env:
          LAB_REQUIRE_TOOLS: "1"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
